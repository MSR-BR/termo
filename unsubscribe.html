<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Cancelar novidades por e-mail | TERMO</title>
  <style>
    :root{color-scheme:light;--ink:#102a43;--muted:#526476;--blue:#004b87;--line:#dbe5ef;--paper:#fff;--bg:#f5f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{width:min(620px,calc(100% - 32px));margin:0 auto;padding:48px 0 72px}.card{padding:clamp(24px,6vw,42px);border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:0 18px 45px rgba(16,42,67,.08)}.brand{color:var(--blue);font-weight:800;text-decoration:none}.eyebrow{margin:30px 0 8px;color:#b33a2c;font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h1{margin:0;font-family:Georgia,serif;font-size:clamp(2rem,8vw,3rem);line-height:1.1}p{color:var(--muted)}button{width:100%;margin-top:14px;padding:14px 18px;border:0;border-radius:999px;background:var(--blue);color:#fff;font:inherit;font-weight:800;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #f2a900;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}.status{min-height:1.6em;margin-top:18px;font-weight:700}.links{margin-top:24px;display:flex;gap:18px;flex-wrap:wrap}.links a{color:var(--blue)}
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="unsubscribe-title">
      <a class="brand" href="home.html">TERMO</a>
      <p class="eyebrow">Preferência de comunicação</p>
      <h1 id="unsubscribe-title">Cancelar novidades por e-mail</h1>
      <p>Ao confirmar, você deixa de receber mensagens opcionais do TERMO. O aplicativo e todo o conteúdo público continuam disponíveis normalmente.</p>
      <button type="button" id="unsubscribeButton">Confirmar descadastro</button>
      <p class="status" id="unsubscribeStatus" role="status" aria-live="polite"></p>
      <nav class="links" aria-label="Links relacionados">
        <a href="privacidade.html">Política de Privacidade</a>
        <a href="home.html">Voltar ao TERMO</a>
      </nav>
    </section>
  </main>
  <script>
    (function () {
      const button = document.getElementById("unsubscribeButton");
      const status = document.getElementById("unsubscribeStatus");
      const token = new URL(window.location.href).searchParams.get("token") || "";
      if (!token) {
        button.disabled = true;
        status.textContent = "Este link de descadastro está incompleto.";
        return;
      }
      button.addEventListener("click", async function () {
        button.disabled = true;
        status.textContent = "Processando sua preferência...";
        try {
          const response = await fetch("/api/email-unsubscribe", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ token: token })
          });
          const payload = await response.json().catch(function () { return {}; });
          if (!response.ok) throw new Error(payload.error || "Não foi possível concluir o descadastro.");
          status.textContent = payload.message || "Descadastro concluído.";
          button.hidden = true;
          window.history.replaceState({}, "", "unsubscribe.html");
        } catch (error) {
          status.textContent = error.message || "Não foi possível concluir o descadastro agora.";
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
